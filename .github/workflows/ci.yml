name: CI

on:
  push:
    branches: [ main, improvements ]
    paths:
      - 'backend/mentalhealth-api/**'
  pull_request:
    branches: [ main ]
    paths:
      - 'backend/mentalhealth-api/**'

jobs:
  build-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/mentalhealth-api
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/mentalhealth-api/package-lock.json
      - name: Install deps
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Run tests
        env:
          NODE_ENV: test
          SKIP_DB: 'true'
        run: npm test
      - name: Build Docker image
        run: |
          docker build -t mentalhealth-api:ci .
      - name: Docker image size
        run: |
          docker image inspect mentalhealth-api:ci --format='Size: {{.Size}}'
